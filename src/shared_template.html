<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- ホーム画面追加後に古いまま固定されないよう、強いキャッシュを持たせない。
     Service Worker も入れない（入れると更新が届かなくなる） -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#17131F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SF 2026">
<title>SF 2026 — 旅のしおり</title>
<link rel="manifest" href="data:application/manifest+json,__MANIFEST__">
<link rel="apple-touch-icon" href="__ICON__">
<style>
:root{
  --ink:#17131F; --ink2:#241C33; --ink3:#312545; --line:#463659;
  --plum:#7B4FB5; --plum-lt:#A97FE0; --gold:#F5C518; --cream:#EDE9E0;
  --dim:#9C8FB0; --ok:#4ED8A0; --warn:#FF8A4C; --red:#E8619D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ink);color:var(--cream);
  font:16px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
.disp{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
a{color:var(--plum-lt)}

/* ===== header ===== */
header{
  position:sticky;top:0;z-index:30;background:rgba(23,19,31,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.clocks{display:flex;align-items:baseline;gap:14px;padding:9px 16px}
.clk{display:flex;align-items:baseline;gap:6px}
.clk .z{font-size:10px;letter-spacing:.12em;color:var(--dim);font-weight:800}
.clk .t{font:700 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.clk.sf .t{color:var(--gold)}
.clk .d{font-size:11px;color:var(--dim)}
.clocks .status{margin-left:auto;font-size:11px;color:var(--dim);text-align:right;line-height:1.35}
.dtabs{display:flex;gap:5px;padding:0 12px 9px;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtab{
  flex:none;border:1px solid var(--line);background:transparent;color:var(--dim);
  border-radius:10px;padding:6px 10px;cursor:pointer;text-align:center;min-width:52px;
}
.dtab .dd{font:700 15px/1.15 ui-monospace,Menlo,monospace}
.dtab .dw{font-size:9.5px;letter-spacing:.06em;margin-top:2px;opacity:.8}
.dtab[aria-selected=true]{background:var(--plum);border-color:var(--plum-lt);color:#fff}
.dtab.today{border-color:var(--gold)}

/* ===== views ===== */
main{padding:0 0 8px}
.view{display:none}
.view.on{display:block}
section{padding:18px 16px 6px}
h2.sec{
  margin:0 0 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);font-weight:800;
}
h3.sub{margin:22px 0 10px;font-size:14px;font-weight:700;color:var(--cream)}

/* ===== day head ===== */
.dayhead{padding:16px 16px 0}
.dayhead .big{font:800 26px/1.2 system-ui;letter-spacing:-.01em}
.dayhead .meta{color:var(--dim);font-size:13px;margin-top:3px}
.anchor-card{
  margin:14px 16px 0;border:1px solid var(--gold);border-radius:12px;
  background:linear-gradient(180deg,rgba(245,197,24,.11),rgba(245,197,24,.03));
  padding:12px 14px;display:flex;align-items:center;gap:12px;
}
.anchor-card .ttl{font:800 22px/1 ui-monospace,Menlo,monospace;color:var(--gold)}
.anchor-card .tx{font-size:13px;line-height:1.45}
.anchor-card .tx b{display:block;font-size:10px;letter-spacing:.14em;color:var(--gold);
  text-transform:uppercase;margin-bottom:2px}

/* ===== timeline ===== */
.tl{position:relative;margin:18px 0 0;padding:0 16px}
.tl::before{content:"";position:absolute;left:71px;top:6px;bottom:14px;width:2px;background:var(--line)}
.it{position:relative;display:flex;gap:0;padding:0 0 4px}
.it .time{
  width:55px;flex:none;text-align:right;padding-right:12px;padding-top:11px;
  font:700 14px/1 ui-monospace,Menlo,monospace;color:var(--cream);font-variant-numeric:tabular-nums;
}
.it .rail{width:24px;flex:none;position:relative;display:flex;justify-content:center;padding-top:14px}
.it .node{
  width:11px;height:11px;border-radius:50%;background:var(--ink);
  border:2px solid var(--plum-lt);z-index:2;position:relative;
}
.it .body{flex:1;min-width:0;padding:8px 0 10px}
.it .ttl{font-weight:700;font-size:15.5px;line-height:1.4}
.it .place{font-size:12.5px;color:var(--plum-lt);margin-top:2px}
.it .note{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.6}

.it.move .time{color:var(--dim);font-size:12px;padding-top:9px}
.it.move .node{width:7px;height:7px;border-style:dashed;border-color:var(--line);background:var(--line)}
.it.move .body{padding:5px 0 7px}
.it.move .ttl{font-weight:600;font-size:13.5px;color:var(--dim)}
.it.move .dur{
  display:inline-block;font:700 11px/1 ui-monospace,Menlo,monospace;color:var(--cream);
  background:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:3px 6px;margin-left:7px;
}
.it.anchor .node{background:var(--gold);border-color:var(--gold);width:14px;height:14px;
  box-shadow:0 0 0 4px rgba(245,197,24,.18)}
.it.anchor .time{color:var(--gold);font-size:15px}
.it.anchor .ttl{color:var(--gold)}
.it.free .node{background:transparent;border-color:var(--line)}
.it.free .ttl{color:var(--dim);font-weight:600}
.it.warn{margin:2px 0 10px}
.it.warn .node{background:var(--warn);border-color:var(--warn)}
.it.warn .ttl{color:var(--warn)}
.it .icon{font-size:13px;margin-right:5px;opacity:.85}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{
  border:1px solid var(--line);background:var(--ink2);color:var(--cream);
  border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;
}
.chip:active{background:var(--ink3)}
.chip[aria-expanded=true]{border-color:var(--gold);color:var(--gold)}
.chip.mine{border-style:dashed;color:var(--dim)}

/* 現在地からの方角 */
.geobox{
  margin-top:9px;border:1px solid var(--gold);border-radius:12px;
  background:linear-gradient(180deg,rgba(245,197,24,.1),rgba(245,197,24,.02));
  padding:13px;display:flex;align-items:center;gap:14px;
}
.geobox .dial{
  width:76px;height:76px;flex:none;border-radius:50%;position:relative;
  border:2px solid var(--line);background:var(--ink);
}
.geobox .dial .n{
  position:absolute;top:3px;left:50%;transform:translateX(-50%);
  font:800 9px/1 system-ui;color:var(--dim);letter-spacing:.1em;
}
.geobox .dial .needle{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.geobox .dial .needle svg{width:40px;height:40px;display:block}
.geobox .rd{flex:1;min-width:0}
.geobox .dist{font:800 25px/1 ui-monospace,Menlo,monospace;color:var(--gold);
  font-variant-numeric:tabular-nums}
.geobox .dist small{font-size:13px;font-weight:700;margin-left:3px}
.geobox .dir{font-size:14px;font-weight:700;margin-top:5px}
.geobox .acc{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.5}
.geobox.err{border-color:var(--line);background:var(--ink2)}
.geobox.err .msg{font-size:13px;color:var(--dim);line-height:1.6}

.fallback{
  margin:16px;border:1px dashed var(--warn);border-radius:12px;padding:13px 15px;
  background:rgba(255,138,76,.06);
}
.fallback b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--warn);margin-bottom:5px;font-weight:800}
.fallback p{margin:0;font-size:13px;line-height:1.65;color:var(--cream)}

.blank{
  margin:20px 16px;border:1px dashed var(--line);border-radius:12px;
  padding:22px 18px;text-align:center;
}
.blank .h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-weight:800;margin-bottom:9px}
.blank p{margin:0;font-size:13.5px;color:var(--dim);line-height:1.7}

/* ===== 日程 overview ===== */
.phase{margin:0 16px 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--plum-lt);font-weight:800;padding-top:16px}
.dcard{
  display:flex;gap:13px;align-items:flex-start;margin:0 16px 9px;padding:13px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--ink2);cursor:pointer;
}
.dcard:active{background:var(--ink3)}
.dcard .dt{flex:none;width:44px;text-align:center}
.dcard .dt .n{font:800 19px/1 ui-monospace,Menlo,monospace}
.dcard .dt .w{font-size:9.5px;color:var(--dim);letter-spacing:.06em;margin-top:3px}
.dcard .info{flex:1;min-width:0}
.dcard .lb{font-weight:700;font-size:15px}
.dcard .bs{font-size:12px;color:var(--dim);margin-top:2px}
.dcard .cnt{flex:none;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;padding-top:4px}

/* ===== マップ ===== */
.mtabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:none;border:1px solid var(--line);background:transparent;color:var(--dim);
  padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.mtab[aria-selected=true]{background:var(--plum);border-color:var(--plum-lt);color:#fff}
#mstage{position:relative;height:62vh;min-height:340px;overflow:hidden;background:#0E0B14;
  touch-action:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#mcanvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#mcanvas img{display:block;max-width:none;pointer-events:none;user-select:none}
.pin{position:absolute;width:0;height:0}
.pin i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;
  border-radius:50% 50% 50% 2px;transform:rotate(45deg);border:2px solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,.6)}
.pin b{position:absolute;left:12px;top:-8px;white-space:nowrap;font-size:10.5px;font-weight:700;
  background:rgba(23,19,31,.9);border:1px solid var(--line);padding:2px 6px;border-radius:5px;
  display:none}
.pin.lb b,.pin.hi b{display:block}
.pin.dim{opacity:.22}
.mfilter{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 4px}
.fchip{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;
  padding:5px 10px;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.fchip .dot{width:8px;height:8px;border-radius:2px}
.fchip[aria-pressed=true]{color:#fff;background:var(--ink3)}
.mzoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.mzoom button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);
  background:rgba(36,28,51,.92);color:var(--cream);font-size:16px;font-weight:700;cursor:pointer}

/* 街の位置関係図 */
.geo{margin:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--ink2);padding:6px}
.geo svg{display:block;width:100%;height:auto}

/* ===== 情報 ===== */
.card{border:1px solid var(--line);border-radius:12px;background:var(--ink2);
  padding:14px;margin-bottom:10px}
.card .cat{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--plum-lt);
  font-weight:800;margin-bottom:6px}
.card .nm{font-weight:700;font-size:15px;line-height:1.4}
.card .dt{font-size:13px;color:var(--cream);margin-top:5px;font-variant-numeric:tabular-nums}
.card .nt{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.6}
.code{
  display:flex;align-items:center;gap:9px;margin-top:9px;padding:9px 11px;
  background:var(--ink);border:1px solid var(--line);border-radius:9px;cursor:pointer;
}
.code .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800}
.code .val{font:700 14px/1 ui-monospace,Menlo,monospace;flex:1;overflow:hidden;text-overflow:ellipsis}
.code .cp{font-size:11px;color:var(--plum-lt);font-weight:700;flex:none}
.qrbtn{
  width:100%;margin-top:10px;border:1px solid var(--gold);border-radius:10px;
  background:rgba(245,197,24,.1);color:var(--gold);font-weight:800;font-size:13px;
  padding:12px;cursor:pointer;letter-spacing:.04em;
}
.tel{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--ink2);margin-bottom:9px;text-decoration:none;color:inherit}
.tel .ic{width:34px;height:34px;flex:none;border-radius:9px;background:var(--ink3);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.tel .nm{font-weight:700;font-size:14.5px}
.tel .no{font:700 13px/1.3 ui-monospace,Menlo,monospace;color:var(--plum-lt);margin-top:2px}
.tel .nt{font-size:11.5px;color:var(--dim);margin-top:3px}
.tip{border-left:2px solid var(--plum);padding:2px 0 2px 13px;margin-bottom:16px}
.tip h4{margin:0 0 4px;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.03em}
.tip p{margin:0;font-size:13.5px;color:var(--cream);line-height:1.7}

/* ===== 準備 ===== */
.prog{display:flex;align-items:center;gap:10px;margin:0 16px 4px}
.prog .bar{flex:1;height:6px;border-radius:99px;background:var(--ink3);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.prog .pc{font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--ok);flex:none}
.ck{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-bottom:1px solid var(--ink3);
  cursor:pointer}
.ck:last-child{border-bottom:0}
.ck .box{width:21px;height:21px;flex:none;border-radius:6px;border:2px solid var(--line);
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);
  font-weight:900;transition:.15s}
.ck.on .box{background:var(--ok);border-color:var(--ok)}
.ck.on .tx{color:var(--dim);text-decoration:line-through}
.ck .tx{font-size:14.5px;line-height:1.5}
.grp{border:1px solid var(--line);border-radius:12px;background:var(--ink2);overflow:hidden;margin-bottom:12px}
.grp .gh{padding:11px 14px;background:var(--ink3);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:800;color:var(--gold);display:flex}
.grp .gh .n{margin-left:auto;color:var(--dim);letter-spacing:0;font-variant-numeric:tabular-nums}

/* ===== XP ===== */
.seg{display:flex;gap:6px;padding:0 16px 4px}
.seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--dim);
  border-radius:9px;padding:9px 4px;font-size:12.5px;font-weight:700;cursor:pointer}
.seg button[aria-selected=true]{background:var(--plum);border-color:var(--plum-lt);color:#fff}
.dayf{display:flex;gap:6px;padding:12px 16px 0}
.dayf button{border:1px solid var(--line);background:transparent;color:var(--dim);
  border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer}
.dayf button[aria-selected=true]{background:var(--ink3);color:var(--gold);border-color:var(--gold)}
.banner{margin:14px 16px 0;border:1px dashed var(--plum-lt);border-radius:11px;
  padding:12px 14px;background:rgba(123,79,181,.1);font-size:12.5px;color:var(--cream);line-height:1.65}
.banner b{color:var(--plum-lt);display:block;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:4px;font-weight:800}
.slot{display:flex;gap:11px;padding:10px 14px;border-bottom:1px solid var(--ink3);align-items:flex-start}
.slot:last-child{border-bottom:0}
.slot .st{width:44px;flex:none;font:700 13px/1.5 ui-monospace,Menlo,monospace;
  color:var(--cream);font-variant-numeric:tabular-nums}
.slot .sb{flex:1;min-width:0}
.slot .sn{font-size:14px;font-weight:600;line-height:1.45}
.slot .sm{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.5}
.slot .sd{flex:none;display:flex;gap:3px;padding-top:2px}
.slot .sd span{font-size:9.5px;font-weight:800;width:16px;height:16px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;background:var(--ink3);color:var(--dim)}
.slot .sd span.on{background:var(--gold);color:var(--ink)}
.slot .kk{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:4px;
  margin-right:5px;vertical-align:1px}
.kk.g{background:rgba(232,97,157,.2);color:#E8619D}
.kk.s{background:rgba(76,168,255,.2);color:#4CA8FF}
.pl{padding:10px 14px;border-bottom:1px solid var(--ink3);font-size:13.5px;line-height:1.6}
.pl:last-child{border-bottom:0}
.pl .pd{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.1em;margin-bottom:5px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;background:var(--ink3);border:1px solid var(--line);border-radius:6px;
  padding:4px 9px;color:var(--cream)}
.price{font-size:13px;padding:8px 14px;border-bottom:1px solid var(--ink3);line-height:1.55}
.price:last-child{border-bottom:0}
.warnline{margin:0 0 10px;padding:9px 12px;border-radius:9px;background:rgba(255,138,76,.1);
  border:1px solid var(--warn);font-size:12px;color:var(--warn);font-weight:600}

/* 展開する詳細 */
.row2{border-bottom:1px solid var(--ink3)}
.row2:last-child{border-bottom:0}
.rowhd{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer}
.rowhd:active{background:var(--ink3)}
.rowhd .rn{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.45}
.rowhd .rt{flex:none;font:700 13px/1.5 ui-monospace,Menlo,monospace;color:var(--cream);
  width:44px;font-variant-numeric:tabular-nums}
.rowhd .cv{flex:none;color:var(--dim);font-size:13px;transition:transform .2s;padding-top:2px}
.row2.open .cv{transform:rotate(90deg);color:var(--gold)}
.row2.open .rn{color:var(--gold)}
.row2.fav .rn::after{content:" ♥";color:var(--red);font-weight:900}
.det{display:none;padding:2px 14px 15px 14px}
.row2.open .det{display:block}
.det .dd{font-size:13.5px;line-height:1.7;color:var(--cream);margin-bottom:11px}
.det .meta{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--dim);
  line-height:1.55;margin-bottom:5px}
.det .meta .k{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--plum-lt);
  width:38px;padding-top:3px}
.det .meta .v{flex:1;color:var(--cream)}
.det .acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.det .acts button{border:1px solid var(--line);background:var(--ink3);color:var(--cream);
  border-radius:8px;padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer}
.det .acts button.go{border-color:var(--plum-lt);color:var(--plum-lt)}
.det .acts button.dn[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#2A0B18}
.det .acts button.sch{border-color:var(--gold);color:var(--gold)}
/* 行きたいリスト */
.favrow{display:flex;gap:10px;align-items:center;padding:11px 14px;
  border-top:1px solid var(--line)}
.favrow:first-of-type{border-top:0}
.favrow .fb{flex:1;min-width:0}
.favrow .fn{font-size:14px;font-weight:700;line-height:1.4}
.favrow .fd{font-size:11.5px;color:var(--dim);margin-top:3px}
.favrow .fa{display:flex;gap:6px;align-items:center;flex-shrink:0}
.favrow .sch{border:1px solid var(--gold);background:transparent;color:var(--gold);
  border-radius:8px;padding:7px 10px;font-size:11.5px;font-weight:700;cursor:pointer}

<body>

<header>

  </div>

<main>

  <div class="view" id="v-map">
    <section style="padding-bottom:0">

      <div class="mzoom">
        <button id="mzin" aria-label="拡大">＋</button>

  <button data-v="plan"><span class="g">🗓</span>日程</button>
  <button data-v="map"><span class="g">🗺</span>マップ</button>
  <button data-v="xp"><span class="g">🎪</span>イベント</button>
  <button data-v="info"><span class="g">📇</span>情報</button>
  <button data-v="prep"><span class="g">✓</span>準備</button>
</nav>

<div id="setup"></div>
<div class="toast" id="toast"></div>

<script>
const TRIP = __TRIP__, MAPS = __MAPS__, PINS = __PINS__;
__SETUP__
__SETUPUI__
const CATS = {event:'#F5C518',shop:'#E8619D',pin:'#4ED8A0',food:'#FF8A4C',
              entry:'#4CA8FF',wc:'#9C8FB0',other:'#A97FE0'};
const CATNAME = {event:'イベント',shop:'物販',pin:'Pin Rally',food:'飲食',
                 entry:'入口・受付',wc:'トイレ',other:'その他'};
const WD = ['日','月','火','水','木','金','土'];
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const toastEl = $('toast');
const toast = m => { toastEl.textContent=m; toastEl.classList.add('on');
  clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.classList.remove('on'),1500); };

/* ---- 時計 ---- */
function parts(tz){
  const f=new Intl.DateTimeFormat('ja-JP',{timeZone:tz,year:'numeric',month:'numeric',
    day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
  const o={}; f.formatToParts(new Date()).forEach(p=>o[p.type]=p.value); return o;
}
function tick(){
  const a=parts('America/Los_Angeles'), b=parts('Asia/Tokyo');
  $('tSF').textContent=`${a.hour}:${a.minute}`; $('dSF').textContent=`${a.month}/${a.day}(${a.weekday})`;
  $('tJP').textContent=`${b.hour}:${b.minute}`; $('dJP').textContent=`${b.month}/${b.day}(${b.weekday})`;
  const today=sfDate();
  const d0=new Date(TRIP.trip.start+'T00:00:00'), dn=new Date(today+'T00:00:00');
  const diff=Math.round((d0-dn)/86400000);
  $('status').innerHTML = diff>0 ? `出発まで<b style="color:var(--gold)"> ${diff} </b>日`
    : (today>TRIP.trip.end ? '' : `${TRIP.trip.sub}`);
}
function sfDate(){
  const a=parts('America/Los_Angeles');
  return `${a.year}-${String(a.month).padStart(2,'0')}-${String(a.day).padStart(2,'0')}`;
}
function sfMinutes(){ const a=parts('America/Los_Angeles'); return +a.hour*60 + +a.minute; }

/* ---- 状態 ---- */
const CK='sf2026-checks', ckState = (()=>{ try{return JSON.parse(localStorage.getItem(CK))||{}}catch(e){return{}} })();
const saveCk=()=>{try{localStorage.setItem(CK,JSON.stringify(ckState))}catch(e){}};
let curDate = (TRIP.days[0]||{}).date || '';
let curMap = MAPS[0].id;
let hidden = new Set();

/* ---- 日付タブ ---- */
function renderDtabs(){
  $('dtabs').innerHTML='';
  TRIP.days.forEach(d=>{
    const dt=new Date(d.date+'T00:00:00');
    const b=document.createElement('button');
    b.className='dtab'+(d.date===sfDate()?' today':'');
    b.setAttribute('aria-selected', d.date===curDate?'true':'false');
    b.innerHTML=`<div class="dd">${dt.getMonth()+1}/${dt.getDate()}</div><div class="dw">${WD[dt.getDay()]}</div>`;
    b.onclick=()=>{ stopGeo(); curDate=d.date; renderDtabs(); renderDay(); go('day'); window.scrollTo(0,0); };
    $('dtabs').appendChild(b);
  });
}

/* ---- 今日 ---- */
function mapChip(key){
  const p=TRIP.places[key]; if(!p) return '';
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking`;
  return `<a class="chip" target="_blank" rel="noopener" href="${dir}">🚶 ここへの道順</a>
    <button class="chip" data-geo="${key}" aria-expanded="false">🧭 方角と距離</button>
    <div class="geoslot"></div>`;
}

/* ---- 現在地からの方角・距離（オフライン動作） ---- */
const R=6371000, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
function haversine(a,b,c,d){
  const dLat=rad(c-a), dLng=rad(d-b);
  const x=Math.sin(dLat/2)**2 + Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function bearing(a,b,c,d){
  const y=Math.sin(rad(d-b))*Math.cos(rad(c));
  const x=Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b));
  return (deg(Math.atan2(y,x))+360)%360;
}
const COMPASS=['北','北北東','北東','東北東','東','東南東','南東','南南東',
               '南','南南西','南西','西南西','西','西北西','北西','北北西'];
const dirName=b=>COMPASS[Math.round(b/22.5)%16];

let geoWatch=null, geoHeading=null, geoActive=null;
const NEEDLE=`<svg viewBox="0 0 40 40"><path d="M20 4 L27 30 L20 25 L13 30 Z"
  fill="#F5C518" stroke="#17131F" stroke-width="1.2" stroke-linejoin="round"/></svg>`;

function stopGeo(){
  if(geoWatch!==null){ navigator.geolocation.clearWatch(geoWatch); geoWatch=null; }
  window.removeEventListener('deviceorientationabsolute',onHeading);
  window.removeEventListener('deviceorientation',onHeading);
  geoHeading=null;
  if(geoActive){
    geoActive.btn.setAttribute('aria-expanded','false');
    geoActive.slot.innerHTML='';
    geoActive=null;
  }
}
function onHeading(e){
  const h = (e.webkitCompassHeading!=null) ? e.webkitCompassHeading
          : (e.absolute && e.alpha!=null) ? (360-e.alpha) : null;
  if(h!=null){ geoHeading=h; paintGeo(); }
}
let lastFix=null;
function paintGeo(){
  if(!geoActive||!lastFix) return;
  const p=TRIP.places[geoActive.key];
  const d=haversine(lastFix.lat,lastFix.lng,p.lat,p.lng);
  const b=bearing(lastFix.lat,lastFix.lng,p.lat,p.lng);
  const rot = geoHeading!=null ? b-geoHeading : b;
  const val = d<1000 ? Math.round(d) : (d/1000).toFixed(1);
  const unit = d<1000 ? 'm' : 'km';
  const walk = Math.max(1, Math.round(d/80));
  const basis = geoHeading!=null ? '端末の向きが上' : '北が上';
  const rough = lastFix.acc>50
    ? `<br>屋内にいると誤差が大きく出ます（現在 ±${Math.round(lastFix.acc)}m）。目安として見てください。` : '';
  geoActive.slot.innerHTML=`<div class="geobox">
    <div class="dial"><span class="n">${geoHeading!=null?'前':'N'}</span>
      <div class="needle" style="transform:rotate(${rot}deg)">${NEEDLE}</div></div>
    <div class="rd">
      <div class="dist">${val}<small>${unit}</small></div>
      <div class="dir">${dirName(b)}の方向　·　徒歩 約${walk}分</div>
      <div class="acc">${esc(p.name)}まで<br>${basis}／誤差 ±${Math.round(lastFix.acc)}m${rough}</div>
    </div></div>`;
}
function showGeoErr(msg){
  if(!geoActive) return;
  geoActive.slot.innerHTML=`<div class="geobox err"><div class="msg">${esc(msg)}</div></div>`;
}
async function startGeo(key, btn, slot){
  stopGeo();
  geoActive={key,btn,slot}; lastFix=null;
  btn.setAttribute('aria-expanded','true');
  slot.innerHTML='<div class="geobox err"><div class="msg">現在地を確認しています…</div></div>';

  if(!navigator.geolocation){ showGeoErr('この端末では現在地を取得できません。「ここへの道順」から地図アプリを開いてください。'); return; }

  // iOS はコンパスに許可が要る（タップ直後でないと出ない）
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r==='granted') window.addEventListener('deviceorientation',onHeading);
    } else {
      window.addEventListener('deviceorientationabsolute',onHeading);
      window.addEventListener('deviceorientation',onHeading);
    }
  }catch(e){}

  geoWatch=navigator.geolocation.watchPosition(
    pos=>{ lastFix={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy||0};

const mst=$('mstage'), mcv=$('mcanvas');
let mImg=null, nW=1, nH=1, tx=0, ty=0, sc=1, minSc=1;
const applyT=()=>mcv.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
function mfit(){ const w=mst.clientWidth,h=mst.clientHeight;
  minSc=Math.min(w/nW,h/nH); sc=minSc; tx=(w-nW*sc)/2; ty=(h-nH*sc)/2; applyT(); rescale(); }
function mclamp(){ const w=mst.clientWidth,h=mst.clientHeight;
  sc=Math.max(minSc*0.9,Math.min(sc,minSc*14));
  const iw=nW*sc, ih=nH*sc;
  tx=iw<=w?(w-iw)/2:Math.min(0,Math.max(w-iw,tx));
  ty=ih<=h?(h-ih)/2:Math.min(0,Math.max(h-ih,ty)); }
function zoomAt(cx,cy,f){ const px=(cx-tx)/sc,py=(cy-ty)/sc; sc*=f; mclamp();
  tx=cx-px*sc; ty=cy-py*sc; mclamp(); applyT(); rescale(); }
function rescale(){
  const show = sc > minSc*2.1;
  mcv.querySelectorAll('.pin').forEach(e=>{
    e.style.transform=`scale(${1/sc})`;
    e.classList.toggle('lb', show);
  });
}

function loadMap(id){
  curMap=id; mcv.innerHTML='';
  mImg=new Image();
  mImg.onload=()=>{ nW=mImg.naturalWidth; nH=mImg.naturalHeight; mfit(); drawPins(); };
  mImg.src=MAPS.find(m=>m.id===id).src;
  mcv.appendChild(mImg);
  renderMtabs();
}
function drawPins(){
  mcv.querySelectorAll('.pin').forEach(e=>e.remove());
  (PINS[curMap]||[]).forEach(p=>{
    const el=document.createElement('div');
    el.className='pin'+(hidden.has(p.cat)?' dim':'');
    el.style.left=(p.x/100*nW)+'px'; el.style.top=(p.y/100*nH)+'px';
    el.style.transform=`scale(${1/sc})`;
    el.innerHTML=`<i style="background:${CATS[p.cat]||CATS.other}"></i><b>${esc(p.name)}</b>`;
    mcv.appendChild(el);
  });
  if(hiSpot){
    const el=document.createElement('div');
    el.className='pin hi';
    el.style.left=(hiSpot.x/100*nW)+'px'; el.style.top=(hiSpot.y/100*nH)+'px';
    el.style.transform=`scale(${1/sc})`;
    el.innerHTML=`<i style="background:#F5C518"></i><b>${esc(hiSpot.label)}</b>`;
    mcv.appendChild(el);
  }
}

const pts=new Map(); let st=null, pd=0;
mst.addEventListener('pointerdown',e=>{ mst.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1) st={x:e.clientX,y:e.clientY,tx,ty};
  if(pts.size===2) pd=pdist(); });
mst.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1&&st){ tx=st.tx+e.clientX-st.x; ty=st.ty+e.clientY-st.y; mclamp(); applyT(); }
  else if(pts.size===2){ const d=pdist();
    if(pd>0){ const c=pcen(), r=mst.getBoundingClientRect(); zoomAt(c.x-r.left,c.y-r.top,d/pd); }
    pd=d; } });
const endP=e=>{ pts.delete(e.pointerId); if(pts.size<2)pd=0; if(!pts.size)st=null; };
mst.addEventListener('pointerup',endP); mst.addEventListener('pointercancel',endP);
const pdist=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
const pcen=()=>{const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}};
mst.addEventListener('wheel',e=>{ e.preventDefault(); const r=mst.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12); },{passive:false});
$('mzin').onclick=()=>zoomAt(mst.clientWidth/2,mst.clientHeight/2,1.4);
$('mzout').onclick=()=>zoomAt(mst.clientWidth/2,mst.clientHeight/2,1/1.4);
$('mzfit').onclick=mfit;

      <button data-e="xp" aria-selected="${evTab==='xp'}">XP</button>
      <button data-e="unite" aria-selected="${evTab==='unite'}">UNITE</button>
      <button data-e="go" aria-selected="${evTab==='go'}">GO</button>
      <button data-e="fav" aria-selected="${evTab==='fav'}">♥${n?' '+n:''}</button>
    </div>
    ${evTab==='xp'?`<div class="seg" style="padding:10px 0 0">
      <button data-s="always" aria-selected="${xpSeg==='always'}">予約不要</button>
      <button data-s="lot" aria-selected="${xpSeg==='lot'}">抽選結果</button>
      <button data-s="side" aria-selected="${xpSeg==='side'}">サイドイベント</button>
    </div>`:''}</section>`;

  if(evTab==='fav'){ h+=renderFav(); paintXp(h); return; }
  if(evTab==='unite'){ h+=renderUnite(uid); }
  if(evTab==='go'){ h+=renderGo(uid); }
  if(evTab!=='xp'){ paintXp(h); return; }

  if(xpSeg==='always'){
    h+=`<section style="padding-top:0">
      <div class="banner"><b>申込なしで行ける</b>3日とも同じ内容で、抽選も予約も要りません。
      定員に達すると入れないものはあります。項目をタップすると、何をする場所か・どこにあるかが出ます。</div>`;
    X.always.forEach((g,gi)=>{
      h+=`<div class="grp" style="margin-top:14px"><div class="gh">${esc(g.g)}</div>`;
      g.items.forEach((it,i)=>h+=xpRow({uid:uid(),key:'a'+gi+'-'+i,n:it.n,d:it.d,l:it.l,h:it.h,
        time:it.h?`${it.h.f}〜${it.h.t}（3日とも）`:'開催中は随時（3日とも）'}));
      h+='</div>';
    });

    h+=`<h3 class="sub">パネル（着席・日替わり）</h3>${dayFilter()}`;
    DAYS3.filter(d=>xpDay==='全'||xpDay===d).forEach(d=>{
      h+=`<div class="grp" style="margin-top:10px"><div class="gh">${d}曜</div>`;
      X.panels[d].forEach((n,i)=>h+=xpRow({uid:uid(),key:'p'+d+i,n,days:d,l:X.panels.loc,
        time:'未公開（会場掲示で確認）',extra:'着席制。その日しかない回なので、見たいものは早めに場所を押さえる'}));
      h+='</div>';
    });

    h+=`<h3 class="sub">ミート＆グリート（先着）</h3>`;
    DAYS3.filter(d=>xpDay==='全'||xpDay===d).forEach(d=>{
      h+=`<div class="grp" style="margin-top:10px"><div class="gh">${d}曜</div>`;
      X.greet[d].forEach((n,i)=>h+=xpRow({uid:uid(),key:'g'+d+i,n,days:d,l:X.greet.loc,
        time:'未公開（先着・並んだ順）'}));
      h+='</div>';
    });
    h+='</section>';
  }

  if(xpSeg==='lot'){
    const R=X.lot_result;
    h+='<section style="padding-top:0">';
    if(R && R.status==='none'){
      h+=`<div class="result"><h4>${esc(R.head)}</h4><p>${esc(R.body)}</p>
        <button class="cta" data-s="always">予約不要のものを見る</button></div>
        <p style="padding:0 16px;margin:0 0 4px;font-size:12px;color:var(--dim);line-height:1.7">
        ${esc(R.keep)}</p>`;
    } else {
      h+=`<div class="banner"><b>結果待ち</b>ここは全部「先行受付リスト（抽選申込）」が要る枠です。</div>`;
    }
    h+=`${dayFilter()}
      <h3 class="sub">ワークショップ（3日とも同じ時間）</h3>
      <div class="grp${R&&R.status==='none'?' lost':''}">`;
    X.workshops.filter(w=>xpDay==='全'||w.d.includes(xpDay)).forEach(w=>
      h+=xpRow({uid:uid(),t:w.t,n:w.n,d:w.m||'',l:w.l,days:w.d,h:w.h,
        time:`${w.t}〜（金土日とも同じ時間）`,
        extra: X.lot_result && X.lot_result.status==='none'
          ? 'この枠は落選。当日キャンセルの案内が出ることはある'
          : '同じ時間で他とぶつかる場合は、金曜にA・土曜にBと日をずらせば両方いける'}));
    h+=`</div><h3 class="sub">ゲスト枠（日替わり・その日限り）</h3>
      <div class="grp${R&&R.status==='none'?' lost':''}">`;
    X.guests.filter(g=>xpDay==='全'||g.d.includes(xpDay)).forEach(g=>
      h+=xpRow({uid:uid(),t:g.t,n:g.n,l:g.l,days:g.d,h:g.h,
        badge:`<span class="kk ${g.k}">${g.k==='s'?'サイン':'グリート'}</span>`,
        time:`${g.t}〜 ／ ${g.d}曜のみ`,
        extra: X.lot_result && X.lot_result.status==='none'
          ? 'この枠は落選。サイン会は抽選のみなので、当日券はない'
          : 'その日しかない枠。ワークショップと重なったらこちらを優先する判断もある'}));
    h+='</div></section>';
  }

  if(xpSeg==='side'){
    h+=`<section style="padding-top:0">
      <div class="banner"><b>別途登録・有料</b>${esc(X.side.note)}</div>${dayFilter()}`;
    X.side.groups.filter(g=>xpDay==='全'||g.d.includes(xpDay)).forEach(g=>{
      h+=`<div class="grp" style="margin-top:12px"><div class="gh">${esc(g.g)}
        <span class="n">${esc(g.d)}</span></div>`;
      if(g.warn) h+=`<div style="padding:11px 14px 2px"><div class="warnline">${esc(g.warn)}</div></div>`;
      g.items.forEach(it=>h+=xpRow({uid:uid(),n:it,l:X.side.loc,time:`${g.d}曜 ／ 時間未公開`,
        extra:'締切は開始15分前（オープン選手権系は30分前）'}));
      h+='</div>';
    });
    h+='</section>';
  }
  h+=`<section style="padding-top:4px"><p style="font-size:11px;color:var(--dim);margin:0">
    ${esc(X.note)}</p></section>`;

  paintXp(h);
}

/* ---- 行きたいリスト（曜日ごと） ---- */
function renderFav(){
  const keys=Object.keys(favState);
  if(!keys.length) return `<section style="padding-top:0">
    <div class="banner"><b>まだ空です</b>XP・UNITE・GO の項目を開いて「♡ 行きたい」を押すと、
    ここに集まります。時間が決まっているものは「📅 スケジュールに追加」で日程にも入ります。</div>
    </section>`;

  /* 予定に入れ済みかどうかを名前で照合する */
  const inPlan = n => (PROF && PROF.plans || []).some(p=>p.title===n);

  const groups=[['金','金曜（8/28）'],['土','土曜（8/29）'],['日','日曜（8/30）'],['','日付が決まっていない']];
  let h='<section style="padding-top:0">';
  groups.forEach(([d,label])=>{
    const ks=keys.filter(k=>{
      const f=favState[k], only=DAYS3.filter(x=>(f.days||'').includes(x));
      return d ? (only.length===1 && only[0]===d) : only.length!==1;
    });
    if(!ks.length) return;
    h+=`<div class="grp" style="margin-top:12px"><div class="gh">${label}
      <span class="n">${ks.length}</span></div>`;
    ks.forEach(k=>{
      const f=favState[k], done=inPlan(f.n);
      h+=`<div class="favrow">
        <div class="fb"><div class="fn">${esc(f.n)}</div>
          <div class="fd">${esc([f.t||f.time, f.a].filter(Boolean).join('　'))}</div></div>
        <div class="fa">
          ${done?'<span class="fdone">日程に追加済み</span>'
                :`<button class="sch" data-sched="${esc(k)}">📅 追加</button>`}
          <button class="unf" data-unfav="${esc(k)}" aria-label="行きたいから外す">♥</button>
        </div></div>`;
    });
    h+='</div>';
  });
  h+=`<p style="font-size:11.5px;color:var(--dim);margin:14px 0 0;line-height:1.7">
    「📅 追加」で日程に入れると、時刻を自分で決められます。
    一日中やっているものは、行きたい時間を入れてください。</p></section>`;
  return h;
}

function paintXp(h){
  $('v-xp').innerHTML=h;
  $('v-xp').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
    evTab=b.dataset.e; xpOpen=null; xpDay='全'; renderXp(); window.scrollTo(0,0); });
  $('v-xp').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    xpSeg=b.dataset.s; xpOpen=null; renderXp(); window.scrollTo(0,0); });
  $('v-xp').querySelectorAll('.dayf button').forEach(b=>b.onclick=()=>{
    xpDay=b.dataset.d; xpOpen=null; renderXp(); });
  $('v-xp').querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.tog, was=xpOpen===id;
    xpOpen = was ? null : id;
    renderXp();
    if(!was) requestAnimationFrame(()=>{
      const el=$('v-xp').querySelector(`[data-uid="${id}"]`);
      if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
    });
  });
  $('v-xp').querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const k=b.dataset.fav;
    if(favState[k]) delete favState[k];
    else { try{ favState[k]=JSON.parse(b.dataset.pay); }catch(err){ favState[k]={n:k}; } }
    saveFav(); renderXp();
    toast(favState[k]?'行きたいに入れました':'行きたいから外しました');
  });
  $('v-xp').querySelectorAll('[data-unfav]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); delete favState[b.dataset.unfav]; saveFav(); renderXp();
    toast('行きたいから外しました');
  });
  $('v-xp').querySelectorAll('[data-sched]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(!PROF){ toast('先に「準備」タブで自分の予定を登録してください'); return; }
    let f=null;
    try{ f=b.dataset.pay ? JSON.parse(b.dataset.pay) : favState[b.dataset.sched]; }
    catch(err){ f=favState[b.dataset.sched]; }
    if(!f){ toast('この項目は追加できません'); return; }
    openPlanEditor(null, schedDraft(f));
  });
  $('v-xp').querySelectorAll('[data-jump]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [m,x,y,label]=b.dataset.jump.split('|');
    jumpToMap(m,+x,+y,label);
  });
  $('v-xp').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.go; xpDone[k]=!xpDone[k]; saveXp(); renderXp(); });
}

/* ---- ユナイト（観戦用） ---- */
function renderUnite(uid){
  const U=TRIP.unite;
  let h=`<section style="padding-top:0">
    <div class="banner"><b>観戦</b>グループステージは8組。試合の時間割はまだ出ていません。
    出たら日程タブに入れます。</div><h3 class="sub">どこで見るか</h3><div class="grp">`;
  U.watch.forEach(w=>h+=xpRow({uid:uid(),n:w.n,d:w.d,l:w.l,h:w.h,time:'—'}));
  h+=`</div><h3 class="sub">グループ組み合わせ</h3>
    <div class="legend">日本のチームを金色にしてあります。5チームが5つの組に分かれているので、
    どの組を追うかで見る時間が変わります。</div><div style="height:12px"></div><div class="grid2">`;
  U.groups.forEach(g=>{
    h+=`<div class="gcard"><div class="gt">GROUP ${g.g}</div>`;
    g.teams.forEach(([r,n])=>h+=`<div class="tm${r==='JP'?' jp':''}">
      <span class="rg">${esc(r)}</span><span class="nm2">${esc(n)}</span></div>`);
    h+='</div>';
  });
  h+=`</div><section style="padding-top:14px"><p style="font-size:11px;color:var(--dim);margin:0">
    ${esc(U.note)}</p></section></section>`;
  return h;
}

/* ---- ポケモンGO（参加用） ---- */
function renderGo(uid){
  const G=TRIP.go;
  let h=`<section style="padding-top:0">
    <div class="banner"><b>開催期間</b>${esc(G.window)}<br>
    前半（8/25〜28）は日本にいる間に始まります。着く前から回せます。</div>
    <h3 class="sub">やること</h3>`;
  G.todo.forEach(x=>{
    const on=xpDone[x.key];
    h+=`<div class="todo${x.warn?' w':''}${on?' done':''}">
      <div class="th" data-go="${x.key}">
        <span class="tw">${esc(x.t)}</span>
        <span class="tn">${esc(x.n)}</span>
        <span class="tc">✓</span></div>
      <div class="td">${esc(x.d)}</div>
      ${x.url?`<div class="ta"><a href="${x.url}" target="_blank" rel="noopener">配信を開く</a></div>`:''}
    </div>`;
  });
  h+=`<h3 class="sub">期間の分かれ目</h3><div class="grp">`;
  G.spawn.forEach(sp=>h+=xpRow({uid:uid(),n:sp.n,d:sp.m,time:sp.d}));
  h+=`</div><h3 class="sub">GO Pass の特典</h3><div class="grp">`;
  G.pass.forEach(p=>h+=xpRow({uid:uid(),n:p.n,d:p.d,time:'期間中'}));
  h+=`</div><h3 class="sub">会場のGO関連</h3><div class="grp">`;
  G.places.forEach(p=>h+=xpRow({uid:uid(),n:p.n,d:p.d,l:p.l,h:p.h,
    time:p.h?`${p.h.f}〜${p.h.t}`:'開催中は随時'}));
  h+=`</div><section style="padding-top:14px"><p style="font-size:11px;color:var(--dim);margin:0">
    ${esc(G.note)}</p></section></section>`;
  return h;
}

function dayFilter(){
  return `<div class="dayf" style="padding-left:0;padding-right:0">${
    ['全','金','土','日'].map(d=>`<button data-d="${d}" aria-selected="${xpDay===d}">${
      d==='全'?'すべて':d+'曜'}</button>`).join('')}</div>`;
}

/* マップへ飛んで該当地点を光らせる */
let hiSpot=null, jumping=false;
function jumpToMap(m,x,y,label){
  hiSpot={x,y,label}; jumping=true;
  go('map'); window.scrollTo(0,0);
  const after=()=>{
    const w=mst.clientWidth,h=mst.clientHeight;
    sc=Math.max(minSc*2.6,minSc); mclamp();
    tx=w/2-(x/100*nW)*sc; ty=h/2-(y/100*nH)*sc;
    mclamp(); applyT(); drawPins(); rescale();
    toast(label.length>22?label.slice(0,22)+'…':label);
    mst.scrollIntoView({block:'center'});
    setTimeout(()=>jumping=false,400);
  };
  if(curMap!==m || !mImg){
    curMap=m; mcv.innerHTML=''; renderMtabs();
    mImg=new Image();
    mImg.onload=()=>{ nW=mImg.naturalWidth; nH=mImg.naturalHeight; mfit(); after(); };
    mImg.src=MAPS.find(z=>z.id===m).src; mcv.appendChild(mImg);
    if(!$('mfilter').children.length) renderFilter();
  } else setTimeout(after,60);
}

/* ---- nav ---- */
function go(v){
  stopGeo();
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on', x.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>
    b.setAttribute('aria-selected', b.dataset.v===v?'true':'false'));
  document.querySelector('header').style.display = (v==='day') ? '' : 'none';
  if(v==='map' && !mImg) { loadMap(curMap); renderFilter(); }
  if(v==='map' && !jumping) setTimeout(()=>{ if(!jumping) mfit(); },60);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ go(b.dataset.v); window.scrollTo(0,0); });

window.addEventListener('resize',()=>{ if(mImg) mfit(); });
function boot(){
  loadProfile();
  if(PROF && PROF.arrive && PROF.arrive.date){
    (PROF.stays||[]).forEach((x,i)=>{ if(x.lat) TRIP.places['stay'+i]=
      {name:x.name, addr:x.addr||'', lat:x.lat, lng:x.lng}; });
    applyProfile();
    curDate = TRIP.days.some(d=>d.date===sfDate()) ? sfDate() : TRIP.days[0].date;
    renderDtabs(); renderDay(); renderPlan(); renderXp(); renderInfo(); renderPrep();
  } else {
    TRIP.days=[{date:'2026-08-28',label:'—',items:[],base:''}];
    renderXp(); renderInfo(); renderPrep();
    openSetup(null);
  }
}
tick(); setInterval(tick,20000);
boot();
</script>
</body>
